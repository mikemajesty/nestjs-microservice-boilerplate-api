name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod
      tag:
        description: 'Tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate Release Source
    runs-on: ubuntu-26.04
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and source branch
        id: source
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag must be in format v1.0.0 (e.g., v1.2.3)"
            echo "   Received: $TAG"
            exit 1
          fi

          git fetch origin master --tags
          COMMIT_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"

          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "❌ Error: Tag $TAG does not point to a commit on master."
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Tag $TAG points to validated source commit $COMMIT_SHA on master."

  validate-code:
    name: Validate Code
    needs: validate-release-source
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release-source.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  release:
    name: Deploy to ${{ github.event.inputs.environment }}
    needs: [validate-release-source, validate-code]
    runs-on: ubuntu-26.04
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release-source.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install SWC
        run: npm install @swc/cli @swc/core

      - name: Build application
        run: npm run build

      - name: Deploy info
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.environment }}"
          echo "📦 Tag: ${{ github.event.inputs.tag }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Docker tag: $VERSION"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            mikelima1989/nestjs-microservice:${{ steps.version.outputs.version }}
            mikelima1989/nestjs-microservice:${{ github.event.inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Changelog
        run: |
          npm install -g conventional-changelog-cli
          conventional-changelog -p conventionalcommits -i CHANGELOG.md -s -r 0
          # Save changelog to temp file
          cp CHANGELOG.md /tmp/CHANGELOG.md
          echo "✅ Changelog generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR to master with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="changelog/${TAG}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a new branch from master for the changelog
          git fetch origin master
          git checkout -b "$BRANCH" origin/master

          # Copy the generated changelog from temp
          cp /tmp/CHANGELOG.md CHANGELOG.md

          # Commit and push
          git add CHANGELOG.md
          git commit -m "docs(changelog): update changelog for ${TAG}"
          git push origin "$BRANCH"

          # Create PR
          BODY="## Changelog Update

          This PR adds the changelog for release \`${TAG}\`.

          **Generated automatically by the Release workflow.**"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "📝 Changelog for ${TAG}" \
            --body "$BODY"

          echo "✅ PR created successfully"

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deploy Complete!

          | Info | Value |
          |------|-------|
          | Environment | \`${{ github.event.inputs.environment }}\` |
          | Tag | \`${{ github.event.inputs.tag }}\` |
          | Docker Tag | \`${{ steps.version.outputs.version }}\` |
          | Triggered by | @${{ github.actor }} |

          ### 📝 Changelog

          A PR was created to merge the changelog to master.
          EOF
