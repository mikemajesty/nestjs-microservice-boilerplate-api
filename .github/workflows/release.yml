name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Validated tag to publish (e.g., v1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Validated tag to publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate Release Source
    runs-on: ubuntu-26.04
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag and source branch
        id: source
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in format v1.0.0. Received: $TAG"
            exit 1
          fi

          git fetch origin --tags '+refs/heads/*:refs/remotes/origin/*'

          if ! COMMIT_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
            echo "Error: Tag $TAG does not exist in this repository."
            exit 1
          fi

          REMOTE_BRANCHES="$(git for-each-ref --contains="$COMMIT_SHA" --format='%(refname)' refs/remotes/origin)"
          if [[ -z "$REMOTE_BRANCHES" ]]; then
            echo "Error: Tag $TAG does not point to a commit on a branch in this repository."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Error: Release $TAG already exists; published releases are immutable."
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG points to $COMMIT_SHA on a remote branch."

  publish-release:
    name: Build and Publish Release
    needs: validate-release-source
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release-source.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure the versioned image tag is unused
        env:
          VERSION: ${{ needs.validate-release-source.outputs.version }}
        run: |
          if docker buildx imagetools inspect "mikelima1989/nestjs-microservice:$VERSION" >/dev/null 2>&1; then
            echo "Error: Docker image tag $VERSION already exists and will not be overwritten."
            exit 1
          fi

      - name: Read build metadata
        id: metadata
        run: echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: mikelima1989/nestjs-microservice:${{ needs.validate-release-source.outputs.version }}
          build-args: NODE_VERSION=${{ steps.metadata.outputs.node_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-release-source.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.validate-release-source.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Error: Docker build did not return a valid image digest."
            exit 1
          fi

          printf 'mikelima1989/nestjs-microservice@%s\n' "$IMAGE_DIGEST" > image-ref.txt

      - name: Generate changelog
        run: |
          npm install --global conventional-changelog-cli
          conventional-changelog -p conventionalcommits -i CHANGELOG.md -s -r 0
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: image-ref.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create changelog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout -B "changelog/${TAG}" origin/master
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog is already up to date; no pull request is needed."
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs(changelog): update changelog for ${TAG}"
          git push origin "HEAD:changelog/${TAG}"

          gh pr create \
            --base master \
            --head "changelog/${TAG}" \
            --title "📝 Changelog for ${TAG}" \
            --body "This PR adds the changelog for release \`${TAG}\`."

      - name: Workflow summary
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.validate-release-source.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Release published

          | Property | Value |
          |----------|-------|
          | Tag | \`$TAG\` |
          | Docker image | \`mikelima1989/nestjs-microservice:$VERSION\` |
          | Image digest | \`$IMAGE_DIGEST\` |

          The changelog pull request is ready for review.
          EOF
