apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-origin-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: default
  source:
    repoURL: https://github.com/mikemajesty/nestjs-microservice-boilerplate-api.git
    targetRevision: master
    path: gitops/cluster/private-origin-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  ignoreDifferences:
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      jsonPointers:
        - /spec/provider/kubernetes/envoyService/annotations/service.beta.kubernetes.io~1aws-load-balancer-security-groups
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
