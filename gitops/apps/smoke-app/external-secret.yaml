apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nestjs-boilerplate-dev-smoke-app
  namespace: nestjs-boilerplate-dev-workload
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    app.kubernetes.io/name: nestjs-boilerplate-dev-smoke-app
    app.kubernetes.io/part-of: nestjs-boilerplate
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nestjs-boilerplate-dev-smoke-app-runtime
    creationPolicy: Owner
  # Lê o secret da foundation com o contrato de env vars usado pelo smoke app.
  dataFrom:
    - extract:
        key: nestjs-boilerplate/dev/smoke-app
