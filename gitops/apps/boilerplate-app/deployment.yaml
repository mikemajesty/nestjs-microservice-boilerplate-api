apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-boilerplate-dev-app
  annotations:
    argocd.argoproj.io/sync-wave: '20'
  labels:
    app.kubernetes.io/name: nestjs-boilerplate-dev-app
    app.kubernetes.io/part-of: nestjs-boilerplate
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nestjs-boilerplate-dev-app
      app.kubernetes.io/part-of: nestjs-boilerplate
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nestjs-boilerplate-dev-app
        app.kubernetes.io/part-of: nestjs-boilerplate
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/environment: dev
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nestjs-boilerplate-dev-app
              app.kubernetes.io/part-of: nestjs-boilerplate
              app.kubernetes.io/managed-by: argocd
              app.kubernetes.io/environment: dev
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nestjs-boilerplate-dev-app
              app.kubernetes.io/part-of: nestjs-boilerplate
              app.kubernetes.io/managed-by: argocd
              app.kubernetes.io/environment: dev
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nestjs-boilerplate-dev-app
                    app.kubernetes.io/part-of: nestjs-boilerplate
                    app.kubernetes.io/managed-by: argocd
                    app.kubernetes.io/environment: dev
      serviceAccountName: nestjs-boilerplate-dev-app
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/os: linux
        workload: app
      tolerations:
        - key: workload
          operator: Equal
          value: app
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nestjs-boilerplate-dev-app
          image: public.ecr.aws/o5e1h1p5/nestjs-boilerplate-dev-app:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: nestjs-boilerplate-dev-app
            - secretRef:
                name: nestjs-boilerplate-dev-app-runtime
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
