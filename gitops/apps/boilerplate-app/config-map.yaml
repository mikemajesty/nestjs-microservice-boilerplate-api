apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-boilerplate-dev-app
  namespace: nestjs-boilerplate-dev-workload
  labels:
    app.kubernetes.io/name: nestjs-boilerplate-dev-app
    app.kubernetes.io/part-of: nestjs-boilerplate
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: dev
data:
  # Main app entry point (use main)
  APP_MAIN: main
  
  # Application config (from .env)
  NODE_ENV: dev
  PORT: '5000'
  HOST: 'http://0.0.0.0:5000'
  TIMEOUT: '5000'
  
  # Logging
  LOG_LEVEL: trace
  DATE_FORMAT: 'dd/MM/yyyy HH:mm:ss'
  TZ: America/Sao_Paulo
  
  # Tokens (expiration format, keys in Secret)
  TOKEN_EXPIRATION: 1h
  REFRESH_TOKEN_EXPIRATION: 1d
  
  # PostgreSQL (connection string in Secret as POSTGRES_URL)
  POSTGRES_DATABASE: nestjs_microservice
  PGADMIN_URL: 'http://pgadmin.default.svc.cluster.local:80'
  
  # MongoDB (connection string in Secret as MONGO_URL)
  IS_DOCUMENTDB: 'true'
  MONGO_EXPRESS_URL: 'http://mongo-express.default.svc.cluster.local:8081'
  MONGO_DATABASE: nestjs_microservice
  
  # Email config (host/port/from, user/pass in Secret)
  EMAIL_HOST: smtp-mail.outlook.com
  EMAIL_PORT: '587'
  EMAIL_FROM: admin@admin.com
  
  # Google Auth (all in Secret)
  GOOGLE_REDIRECT_URI: 'http://localhost:5000/api/v1/login/google/callback'
  
  # OpenTelemetry / Observability
  ZIPKIN_URL: 'http://zipkin.monitoring.svc.cluster.local:9411'
  PROMETHEUS_URL: 'http://prometheus.monitoring.svc.cluster.local:9090'
  PROMETHUES_URL: 'http://prometheus.monitoring.svc.cluster.local:9090'
  COLLECTOR_OTLP_ENABLED: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.monitoring.svc.cluster.local:4317'
  OTEL_EXPORTER_OTLP_PROTOCOL: 'grpc'
  GRAFANA_URL: 'http://grafana.monitoring.svc.cluster.local:3000'
  LOKI_URL: 'http://loki.monitoring.svc.cluster.local:3100'
