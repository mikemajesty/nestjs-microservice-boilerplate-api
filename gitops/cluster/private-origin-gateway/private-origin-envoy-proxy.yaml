apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private-origin-envoy-proxy
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    boilerplate.dev/envoy-nlb-sg-id: '#:ssm:/boilerplate/dev/infra/envoy-nlb-sg-id'
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDaemonSet:
        pod:
          nodeSelector:
            boilerplate.dev/node-pool: gateway
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      envoyService:
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: 'application=envoy-gateway-nlb'
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: 'preserve_client_ip.enabled=true'
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
          # Security group ID resolved by ssm-annotation-resolver webhook
          # Referenced from parent EnvoyProxy annotation
          service.beta.kubernetes.io/aws-load-balancer-security-groups: |
            [
              "placeholder-resolved-at-admission-time"
            ]
