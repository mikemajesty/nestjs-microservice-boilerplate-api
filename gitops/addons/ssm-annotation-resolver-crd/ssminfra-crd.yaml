apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ssminfras.ssm-annotation-resolver.io
spec:
  group: ssm-annotation-resolver.io
  names:
    kind: SsmAnnotationResolverInfra
    listKind: SsmAnnotationResolverInfraList
    plural: ssminfras
    shortNames:
      - ssminfra
    singular: ssminfra
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sqsQueueName
                - dlqQueueName
                - eventBridgeRuleName
                - awsRegion
              properties:
                sqsQueueName:
                  type: string
                  minLength: 1
                  description: SQS queue name
                dlqQueueName:
                  type: string
                  minLength: 1
                  description: DLQ (Dead Letter Queue) name
                eventBridgeRuleName:
                  type: string
                  minLength: 1
                  description: EventBridge rule name for SSM Parameter Store events
                awsRegion:
                  type: string
                  minLength: 1
                  description: AWS region for SQS resources
                serviceAccountName:
                  type: string
                  default: ssm-annotation-resolver
                  description: Kubernetes Service Account name that will assume the IAM role
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Failed
                  description: Phase of infrastructure provisioning
                outputs:
                  type: object
                  properties:
                    sqsQueueUrl:
                      type: string
                    sqsQueueArn:
                      type: string
                    dlqQueueUrl:
                      type: string
                    dlqQueueArn:
                      type: string
                    eventBridgeRuleArn:
                      type: string
                message:
                  type: string
                  description: Human-readable error message if phase is Failed
                lastUpdateTime:
                  type: string
                  format: date-time
                  description: Last update timestamp
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: SQS Queue URL
          type: string
          jsonPath: .status.outputs.sqsQueueUrl
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
