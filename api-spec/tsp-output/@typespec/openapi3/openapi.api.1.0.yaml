    Health.DependencyCheck:
      type: object
      required:
        - status
        - latencyMs
      properties:
        status:
          type: string
          description: 'Dependency status: **UP** | **DOWN**'
        latencyMs:
          type: number
          format: decimal
          description: Time the check took in milliseconds; on failure, time until the error or the 2s timeout
      description: result of a single dependency check
    Health.EventLoopLagOutput:
      type: object
      required:
        - meanMs
        - maxMs
        - p99Ms
      properties:
        meanMs:
          type: number
          format: decimal
          description: Mean event loop delay in milliseconds over the window; the sampler resolution is already subtracted
        maxMs:
          type: number
          format: decimal
          description: Maximum event loop delay in milliseconds over the window; the sampler resolution is already subtracted
        p99Ms:
          type: number
          format: decimal
          description: 99th percentile event loop delay in milliseconds over the window; the sampler resolution is already subtracted
      description: event loop lag metrics
    Health.GcOutput:
      type: object
      required:
        - count
        - minor
        - major
        - totalPauseMs
        - maxPauseMs
      properties:
        count:
          type: integer
          format: int32
          description: Garbage collections in the window
        minor:
          type: integer
          format: int32
          description: Young-generation collections (Scavenge); frequent and cheap
        major:
          type: integer
          format: int32
          description: Full collections (Mark-Compact); frequent major GCs indicate memory pressure
        totalPauseMs:
          type: number
          format: decimal
          description: Sum of GC pause durations in milliseconds
        maxPauseMs:
          type: number
          format: decimal
          description: Longest single GC pause in milliseconds
      description: garbage collection metrics over the window
    Health.HealthOutputLoad:
      type: object
      required:
        - load
        - status
      properties:
        load:
          type: number
          format: decimal
          description: load average
        status:
          type: string
          description: 'load average status: **healthy** | **warning** | **overloaded**'
      description: load average
    Health.HeapSpaceOutput:
      type: object
      required:
        - name
        - size
        - used
        - available
      properties:
        name:
          type: string
          description: V8 space name, e.g. new_space, old_space, large_object_space
        size:
          type: string
          description: Total size of the space
        used:
          type: string
          description: Used size of the space
        available:
          type: string
          description: Available size of the space
      description: V8 heap space metrics
    Health.LivenessOutput:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          type: string
          description: 'Application status: **UP** | **DOWN**'
        timestamp:
          type: string
          description: Timestamp of the health check
        uptime:
          type: number
          format: decimal
          description: Application uptime in seconds
      description: Liveness probe response model
    Health.MemoryOutput:
      type: object
      required:
        - process
        - v8
        - container
        - heapSpaces
      properties:
        process:
          type: object
          properties:
            usedRam:
              type: string
              description: |2-
                  RSS: physical memory resident for the process. Can be lower than heapTotal, because
                  committed-but-untouched pages and (on macOS) compressed pages are not counted.
            heapTotal:
              type: string
              description: Heap memory committed by V8.
            heapUsed:
              type: string
              description: Heap memory currently used by V8.
            external:
              type: string
              description: Memory allocated outside the V8 heap (e.g., buffers, native bindings).
            arrayBuffers:
              type: string
              description: ArrayBuffer memory currently allocated, a subset of `external`.
          required:
            - usedRam
            - heapTotal
            - heapUsed
            - external
            - arrayBuffers
          description: process memory
        v8:
          type: object
          properties:
            totalHeapSize:
              type: string
              description: Total heap size managed by V8.
            executableHeapSize:
              type: string
              description: Heap size reserved for compiled JavaScript code.
            heapSizeLimit:
              type: string
              description: Maximum heap size before memory allocation fails; compare against the container memory limit.
          required:
            - totalHeapSize
            - executableHeapSize
            - heapSizeLimit
          description: v8 memory
        container:
          type: object
          properties:
            limit:
              type: string
              nullable: true
              description: Memory limit; null when the process has no constraint (e.g. local machine)
            rssPercent:
              type: number
              format: decimal
              nullable: true
              description: RSS as a percentage of the limit; null when there is no limit
          required:
            - limit
            - rssPercent
          description: |2-
              Memory limit imposed by the OS (cgroup in containers), from process.constrainedMemory().
              When RSS reaches it, the kernel kills the process (OOMKilled) instead of V8 raising an error.
        heapSpaces:
          type: array
          items:
            $ref: '#/components/schemas/Health.HeapSpaceOutput'
          description: |2-
              Per-space heap breakdown from v8.getHeapSpaceStatistics(). A long-lived leak
              surfaces in `old_space`; large strings/arrays in `large_object_space`; a busy
              but flat `new_space` is allocation churn, not a leak.
      description: memory usage
    Health.MetricsOutput:
      type: object
      required:
        - version
        - timestamp
        - window
        - process
        - memory
        - eventLoopLag
        - gc
        - network
        - cpu
        - mongo
        - postgres
        - redis
      properties:
        version:
          type: string
          description: application version
        timestamp:
          type: string
          description: Timestamp of the snapshot
        window:
          type: object
          properties:
            seconds:
              type: number
              format: decimal
              description: Length of the window in seconds
          required:
            - seconds
          description: |2-
              Event loop, GC and process CPU are aggregated since the previous call to this endpoint, then reset.
              HTTP request rate and latency are exported via OpenTelemetry, not here.
        process:
          allOf:
            - $ref: '#/components/schemas/Health.ProcessOutput'
          description: process information
        memory:
          allOf:
            - $ref: '#/components/schemas/Health.MemoryOutput'
          description: memory usage
        eventLoopLag:
          allOf:
            - $ref: '#/components/schemas/Health.EventLoopLagOutput'
          description: event loop lag over the window
        gc:
          allOf:
            - $ref: '#/components/schemas/Health.GcOutput'
          description: garbage collection over the window
        network:
          type: object
          properties:
            connections:
              type: integer
              format: int32
              nullable: true
              description: Open TCP sockets on the HTTP server, keep-alive included; null when unavailable
          required:
            - connections
          description: network information
        cpu:
          type: object
          properties:
            cpus:
              type: integer
              format: int16
              description: number of logical CPUs
            globalAverage:
              type: object
              properties:
                lastMinute:
                  allOf:
                    - $ref: '#/components/schemas/Health.HealthOutputLoad'
                  description: cpu load average on last minute
                lastFiveMinutes:
                  allOf:
                    - $ref: '#/components/schemas/Health.HealthOutputLoad'
                  description: cpu load average on five minute
                lastFifteenMinutes:
                  allOf:
                    - $ref: '#/components/schemas/Health.HealthOutputLoad'
                  description: cpu load average on fifteen minute
              required:
                - lastMinute
                - lastFiveMinutes
                - lastFifteenMinutes
              description: cpu load average
            cores:
              type: array
              items:
                type: object
                properties:
                  core:
                    type: integer
                    format: int16
                    description: cpu core number
                  load:
                    type: string
                    description: cpu core load
                required:
                  - core
                  - load
              description: cpu cores
          required:
            - cpus
            - globalAverage
            - cores
          description: host CPU; machine-wide values, all processes included
        mongo:
          type: object
          properties:
            connection:
              type: object
              allOf:
                - $ref: '#/components/schemas/Health.MongoConnectionOutput'
              nullable: true
              description: MongoDB serverStatus.connections (server-wide, all clients); null when unavailable
            memory:
              allOf:
                - $ref: '#/components/schemas/Health.MongoCacheMemoryOutput'
              description: MongoDB WiredTiger cache metrics; values may be null when unsupported or unavailable
          required:
            - connection
            - memory
          description: mongo metrics
        postgres:
          type: object
          properties:
            connection:
              type: object
              allOf:
                - $ref: '#/components/schemas/Health.PostgresConnectionOutput'
              nullable: true
              description: PostgreSQL connection metrics; null when unavailable
            databaseSizeBytes:
              type: string
              nullable: true
              description: Size of the application database (current_database()) in bytes; null when unavailable
          required:
            - connection
            - databaseSizeBytes
          description: postgres metrics
        redis:
          type: object
          allOf:
            - $ref: '#/components/schemas/Health.RedisInfoOutput'
          nullable: true
          description: Redis INFO metrics; null when Redis is unreachable or INFO failed
      description: metrics output; does not decide readiness
    Health.MongoCacheMemoryOutput:
      type: object
      required:
        - used
        - limit
      properties:
        used:
          type: string
          nullable: true
          description: Bytes currently in the cache
        limit:
          type: string
          nullable: true
          description: Maximum bytes configured for the cache
      description: MongoDB WiredTiger cache metrics; values may be null when unsupported or unavailable
    Health.MongoConnectionOutput:
      type: object
      required:
        - active
        - available
        - current
        - totalCreated
      properties:
        active:
          type: integer
          format: int64
          description: Number of active connections currently in use
        available:
          type: integer
          format: int64
          description: Number of connection slots available for new clients
        current:
