      security:
        - BearerAuth: []
    delete:
      operationId: RoleController_delete
      description: delete role
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Role.DeleteParamsInput'
