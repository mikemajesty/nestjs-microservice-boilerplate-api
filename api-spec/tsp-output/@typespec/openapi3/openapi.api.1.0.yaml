    Health.ProcessOutput:
      type: object
      required:
        - hostname
        - pid
        - nodeVersion
        - environment
        - uptimeSeconds
        - cpu
      properties:
        hostname:
          type: string
          description: Machine or pod name; in Kubernetes it identifies which pod answered
        pid:
          type: integer
          format: int32
          description: Process id
        nodeVersion:
          type: string
          description: Node.js version
        environment:
          type: string
          description: Application environment
