            application/json:
              schema:
                $ref: '#/components/schemas/User.UpdateParamsValidationError'
        '404':
          description: When user role not found
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/User.UpdateRoleNotFoundError'
                  - $ref: '#/components/schemas/User.UpdateUserNotFoundError'
        '409':
          description: When user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.UpdateExistConflictError'
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User.UpdateInput'
      security:
        - BearerAuth: []
    get:
      operationId: UserController_getById
      description: get user by id
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/User.GetByIdParamsInput'
      responses:
        '200':
          description: get user by id successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.GetByIdOutput'
        '400':
          description: When input params is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.GetByIdParamsValidationError'
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.GetByIdUserNotFoundError'
      tags:
        - User
      security:
        - BearerAuth: []
    delete:
      operationId: UserController_delete
      description: delete user
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/User.DeleteParamsInput'
      responses:
        '200':
          description: delete user successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.DeleteOutput'
        '400':
          description: When input params is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.DeleteParamsValidationError'
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User.DeleteUserNotFoundError'
      tags:
        - User
      security:
        - BearerAuth: []
  /health/dashboard:
    get:
      operationId: HealthController_dashboard
      description: HTML dashboard that polls /health/live, /health/startup, /health/ready and /health/metrics
      parameters: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      tags:
        - Health
  /health/live:
    get:
      operationId: HealthController_liveness
      description: Liveness probe - checks if application process is alive
      parameters: []
      responses:
        '200':
          description: Simple status indicating if the application process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.LivenessOutput'
      tags:
        - Health
  /health/metrics:
    get:
      operationId: HealthController_metrics
      description: |2-
          Process, runtime and dependency metrics for dashboards and troubleshooting.
          Does not decide readiness. The snapshot is cached for 5s: `timestamp` is when it was collected,
          and event loop, GC and process CPU cover the window since the previous collection.
      parameters: []
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.MetricsOutput'
      tags:
        - Health
  /health/ready:
    get:
      operationId: HealthController_readiness
      description: |2-
          Readiness probe - checks if the application can handle requests.
          Only pings MongoDB, PostgreSQL and Redis (2s timeout each), so it stays cheap for orchestrators.
          Answers **503** when any dependency is DOWN.
          The checks are cached for 2s and shared with /health/startup.
      parameters: []
      responses:
        '200':
          description: Overall status and the result of each dependency check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.ReadinessOutput'
        '503':
          description: Overall status and the result of each dependency check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.ReadinessOutput'
      tags:
        - Health
  /health/startup:
    get:
      operationId: HealthController_startup
      description: Startup probe - checks if application has finished initializing
      parameters: []
      responses:
        '200':
          description: Basic connection status without heavy I/O operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.StartupOutput'
      tags:
        - Health
