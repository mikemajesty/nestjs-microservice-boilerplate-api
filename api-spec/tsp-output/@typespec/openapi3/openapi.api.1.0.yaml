openapi: 3.0.0
info:
  title: Microservice API
  version: '1.0'
tags:
  - name: Alert
  - name: Login
  - name: User
  - name: Role
  - name: Reset password
  - name: Permission
  - name: Logout
  - name: Health
  - name: Cat
paths:
  /:
    get:
      operationId: RootHealthController_root
      description: Liveness probe (root) - checks if application process is alive
      parameters: []
      responses:
        '200':
          description: Simple status indicating if the application process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health.LivenessOutput'
      tags:
        - Health
  /alert:
    post:
      operationId: AlertController_handleAlert
      description: Handle alert webhook
      parameters: []
      responses:
        '200':
          description: Alert received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert.AlertOutput'
      tags:
        - Alert
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
  /api/{version}/cats:
    post:
      operationId: CatController_create
      description: create cat
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '200':
          description: cat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.CreateOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.CreateValidationError'
      tags:
        - Cat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cat.CreateInput'
      security:
        - BearerAuth: []
    get:
      operationId: CatController_list
      description: list cats
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.page'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.limit'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.sort'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.search'
      responses:
        '200':
          description: list cats successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.ListOutput'
      tags:
        - Cat
      security:
        - BearerAuth: []
  /api/{version}/cats/{id}:
    put:
      operationId: CatController_update
      description: update cat
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Cat.UpdateParamInput'
      responses:
        '200':
          description: cat updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.UpdateOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.UpdateValidationError'
        '404':
          description: When cat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.UpdateCatNotFoundError'
      tags:
        - Cat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cat.UpdateInput'
      security:
        - BearerAuth: []
    get:
      operationId: CatController_getById
      description: get cat by id
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Cat.GetByIdParamInput'
      responses:
        '200':
          description: get cat by id successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.GetByIdOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.GetByIdValidationError'
        '404':
          description: When cat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.GetByIdCatNotFoundError'
      tags:
        - Cat
      security:
        - BearerAuth: []
    delete:
      operationId: CatController_delete
      description: delete cat
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Cat.DeleteParamInput'
      responses:
        '200':
          description: cat deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.DeleteOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.DeleteValidationError'
        '404':
          description: When cat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat.DeleteCatNotFoundError'
      tags:
        - Cat
      security:
        - BearerAuth: []
  /api/{version}/login:
    post:
      operationId: LoginController_login
      description: user login; opens a new session
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '201':
          description: login successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.LoginOutput'
        '400':
          description: When login input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.LoginValidationError'
        '401':
          description: |-
            When the email is unknown or the password is wrong. Both cases answer the same error,
            so the endpoint does not reveal which emails have an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.LoginInvalidCredentialsError'
      tags:
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login.LoginInput'
  /api/{version}/login/google:
    get:
      operationId: LoginController_loginGoogle
      description: Google OAuth login redirect
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '204':
          description: Redirects to Google OAuth
      tags:
        - Login
  /api/{version}/login/google/callback:
    get:
      operationId: LoginController_loginGoogleCallback
      description: Google OAuth callback
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '204':
          description: Handles Google OAuth callback
      tags:
        - Login
  /api/{version}/logout:
    get:
      operationId: LogoutController_logout
      description: |-
        Ends the session of the access token sent in the Authorization header.
        Its access and refresh tokens stop working immediately; other sessions of the user are kept.
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '204':
          description: session ended
        '401':
          description: When the token is missing, invalid or its session was already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout.LogoutUnauthorizedError'
      tags:
        - Logout
      security:
        - BearerAuth: []
  /api/{version}/permissions:
    post:
      operationId: PermissionController_create
      description: create permission
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '200':
          description: permission created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.CreateOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.CreateValidationError'
        '409':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.ConflictPermissionExistsError'
      tags:
        - Permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission.CreateInput'
      security:
        - BearerAuth: []
    get:
      operationId: PermissionController_list
      description: list permission
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.page'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.limit'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.sort'
        - $ref: '#/components/parameters/Utils.Model.ApiPaginationInput.search'
      responses:
        '200':
          description: list permission successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.ListOutput'
      tags:
        - Permission
      security:
        - BearerAuth: []
  /api/{version}/permissions/{id}:
    put:
      operationId: PermissionController_update
      description: update permission
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Permission.UpdateParamsInput'
      responses:
        '200':
          description: permission updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.UpdateOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.UpdateValidationError'
        '404':
          description: When permission not found
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Permission.UpdatePermissionNotFoundError'
                  - $ref: '#/components/schemas/Permission.UpdatePermissionAlreadyExistsError'
      tags:
        - Permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission.UpdateInput'
      security:
        - BearerAuth: []
    get:
      operationId: PermissionController_getById
      description: get permission
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Permission.GetByIdParamsInput'
      responses:
        '200':
          description: get permission successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.GetByIdOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.GetByIdValidationError'
        '404':
          description: When permission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.GeyByIdPermissionNotFoundError'
      tags:
        - Permission
      security:
        - BearerAuth: []
    delete:
      operationId: PermissionController_delete
      description: delete permission
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/Permission.DeleteParamsInput'
      responses:
        '200':
          description: delete permission successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.DeleteOutput'
        '400':
          description: When input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.DeleteValidationError'
        '404':
          description: When permission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission.DeletePermissionNotFoundError'
      tags:
        - Permission
      security:
        - BearerAuth: []
  /api/{version}/refresh:
    post:
      operationId: LoginController_refresh
      description: |-
        Exchanges a refresh token for a new access/refresh token pair (rotation).
        The refresh token sent stops working; always store the new one.
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '201':
          description: new token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.RefreshTokenOutput'
        '400':
          description: When refresh input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.RefreshValidationError'
        '401':
          description: |-
            When the refresh token is invalid, expired, already used, or its session was ended
            (logout, password change or reset). Reusing an already used refresh token also ends its session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login.RefreshInvalidTokenError'
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Login.LoginUserNotFoundError'
                  - $ref: '#/components/schemas/Login.LoginRoleNotFoundError'
      tags:
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login.RefreshTokenInput'
  /api/{version}/reset-password/send-email:
    post:
      operationId: ResetPasswordController_sendEmail
      description: send email
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
      responses:
        '200':
          description: email sended successfully
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword.SendEmailUserNotFoundError'
      tags:
        - Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword.SendEmailInput'
      security:
        - BearerAuth: []
  /api/{version}/reset-password/{token}:
    put:
      operationId: ResetPasswordController_confirmResetPassword
      description: reset password
      parameters:
        - $ref: '#/components/parameters/Utils.Versioning.VersionParams'
        - $ref: '#/components/parameters/ResetPassword.ConfirmResetPasswordParamsInput'
      responses:
        '200':
          description: password changed successfully
        '400':
          description: When password are differents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword.ConfirmResetPasswordPasswordAreDifferentError'
        '401':
          description: When the token is not the last reset-password token sent to the user, or it was already used
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ResetPassword.ConfirmResetPasswordTokenWasExpiredError'
                  - $ref: '#/components/schemas/ResetPassword.ConfirmResetPasswordInvalidTokenError'
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPassword.ConfirmResetPasswordUserNotFoundError'
      tags:
        - Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword.ConfirmResetPasswordInput'
      security:
        - BearerAuth: []
  /api/{version}/roles:
