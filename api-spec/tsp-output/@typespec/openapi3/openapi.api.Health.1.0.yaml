openapi: 3.0.0
info:
  title: Health
  version: '1.0'
tags:
  - name: Health
paths:
  /:
    get:
      operationId: RootHealthController_root
      description: Liveness probe (root) - checks if application process is alive
      parameters: []
      responses:
        '200':
          description: Simple status indicating if the application process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessOutput'
      tags:
        - Health
  /health/dashboard:
    get:
      operationId: HealthController_dashboard
      description: HTML dashboard that polls /health/live, /health/startup, /health/ready and /health/metrics
      parameters: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      tags:
        - Health
  /health/live:
    get:
      operationId: HealthController_liveness
      description: Liveness probe - checks if application process is alive
      parameters: []
      responses:
        '200':
          description: Simple status indicating if the application process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessOutput'
      tags:
        - Health
  /health/metrics:
    get:
      operationId: HealthController_metrics
      description: |2-
          Process, runtime and dependency metrics for dashboards and troubleshooting.
          Does not decide readiness. The snapshot is cached for 5s: `timestamp` is when it was collected,
          and event loop, GC and process CPU cover the window since the previous collection.
      parameters: []
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsOutput'
      tags:
        - Health
  /health/ready:
    get:
      operationId: HealthController_readiness
      description: |2-
          Readiness probe - checks if the application can handle requests.
          Only pings MongoDB, PostgreSQL and Redis (2s timeout each), so it stays cheap for orchestrators.
          Answers **503** when any dependency is DOWN.
          The checks are cached for 2s and shared with /health/startup.
      parameters: []
      responses:
        '200':
          description: Overall status and the result of each dependency check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessOutput'
        '503':
          description: Overall status and the result of each dependency check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessOutput'
      tags:
        - Health
  /health/startup:
    get:
      operationId: HealthController_startup
      description: Startup probe - checks if application has finished initializing
      parameters: []
      responses:
        '200':
          description: Basic connection status without heavy I/O operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupOutput'
      tags:
        - Health
components:
  schemas:
    DependencyCheck:
      type: object
      required:
        - status
        - latencyMs
      properties:
        status:
          type: string
          description: 'Dependency status: **UP** | **DOWN**'
        latencyMs:
          type: number
          format: decimal
          description: Time the check took in milliseconds; on failure, time until the error or the 2s timeout
      description: result of a single dependency check
    EventLoopLagOutput:
      type: object
      required:
        - meanMs
        - maxMs
        - p99Ms
      properties:
        meanMs:
          type: number
          format: decimal
          description: Mean event loop delay in milliseconds over the window; the sampler resolution is already subtracted
        maxMs:
          type: number
          format: decimal
          description: Maximum event loop delay in milliseconds over the window; the sampler resolution is already subtracted
        p99Ms:
          type: number
          format: decimal
          description: 99th percentile event loop delay in milliseconds over the window; the sampler resolution is already subtracted
      description: event loop lag metrics
    GcOutput:
      type: object
      required:
        - count
        - minor
        - major
        - totalPauseMs
        - maxPauseMs
      properties:
        count:
          type: integer
          format: int32
          description: Garbage collections in the window
        minor:
          type: integer
          format: int32
          description: Young-generation collections (Scavenge); frequent and cheap
        major:
          type: integer
          format: int32
          description: Full collections (Mark-Compact); frequent major GCs indicate memory pressure
        totalPauseMs:
          type: number
          format: decimal
          description: Sum of GC pause durations in milliseconds
        maxPauseMs:
          type: number
          format: decimal
          description: Longest single GC pause in milliseconds
      description: garbage collection metrics over the window
    HealthOutputLoad:
      type: object
      required:
        - load
        - status
      properties:
        load:
          type: number
          format: decimal
          description: load average
        status:
          type: string
          description: 'load average status: **healthy** | **warning** | **overloaded**'
      description: load average
    HeapSpaceOutput:
      type: object
      required:
        - name
        - size
        - used
        - available
      properties:
        name:
          type: string
          description: V8 space name, e.g. new_space, old_space, large_object_space
        size:
          type: string
          description: Total size of the space
        used:
          type: string
          description: Used size of the space
        available:
          type: string
          description: Available size of the space
      description: V8 heap space metrics
    LivenessOutput:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          type: string
          description: 'Application status: **UP** | **DOWN**'
        timestamp:
          type: string
          description: Timestamp of the health check
        uptime:
          type: number
          format: decimal
          description: Application uptime in seconds
      description: Liveness probe response model
    MemoryOutput:
      type: object
      required:
        - process
        - v8
        - container
        - heapSpaces
      properties:
        process:
          type: object
          properties:
            usedRam:
              type: string
              description: |2-
                  RSS: physical memory resident for the process. Can be lower than heapTotal, because
                  committed-but-untouched pages and (on macOS) compressed pages are not counted.
            heapTotal:
              type: string
              description: Heap memory committed by V8.
            heapUsed:
              type: string
              description: Heap memory currently used by V8.
            external:
              type: string
              description: Memory allocated outside the V8 heap (e.g., buffers, native bindings).
            arrayBuffers:
              type: string
              description: ArrayBuffer memory currently allocated, a subset of `external`.
          required:
            - usedRam
            - heapTotal
            - heapUsed
            - external
            - arrayBuffers
          description: process memory
        v8:
          type: object
          properties:
            totalHeapSize:
              type: string
              description: Total heap size managed by V8.
            executableHeapSize:
              type: string
              description: Heap size reserved for compiled JavaScript code.
            heapSizeLimit:
              type: string
              description: Maximum heap size before memory allocation fails; compare against the container memory limit.
          required:
            - totalHeapSize
            - executableHeapSize
            - heapSizeLimit
          description: v8 memory
        container:
          type: object
          properties:
            limit:
              type: string
              nullable: true
              description: Memory limit; null when the process has no constraint (e.g. local machine)
            rssPercent:
              type: number
              format: decimal
              nullable: true
              description: RSS as a percentage of the limit; null when there is no limit
          required:
            - limit
            - rssPercent
          description: |2-
              Memory limit imposed by the OS (cgroup in containers), from process.constrainedMemory().
              When RSS reaches it, the kernel kills the process (OOMKilled) instead of V8 raising an error.
        heapSpaces:
          type: array
          items:
            $ref: '#/components/schemas/HeapSpaceOutput'
          description: |2-
              Per-space heap breakdown from v8.getHeapSpaceStatistics(). A long-lived leak
              surfaces in `old_space`; large strings/arrays in `large_object_space`; a busy
              but flat `new_space` is allocation churn, not a leak.
      description: memory usage
    MetricsOutput:
      type: object
      required:
        - version
        - timestamp
        - window
        - process
        - memory
        - eventLoopLag
        - gc
        - network
        - cpu
        - mongo
        - postgres
        - redis
      properties:
        version:
          type: string
          description: application version
        timestamp:
          type: string
          description: Timestamp of the snapshot
        window:
          type: object
          properties:
            seconds:
              type: number
              format: decimal
              description: Length of the window in seconds
          required:
            - seconds
          description: |2-
              Event loop, GC and process CPU are aggregated since the previous call to this endpoint, then reset.
              HTTP request rate and latency are exported via OpenTelemetry, not here.
        process:
          allOf:
            - $ref: '#/components/schemas/ProcessOutput'
          description: process information
        memory:
          allOf:
            - $ref: '#/components/schemas/MemoryOutput'
          description: memory usage
        eventLoopLag:
          allOf:
            - $ref: '#/components/schemas/EventLoopLagOutput'
          description: event loop lag over the window
        gc:
          allOf:
            - $ref: '#/components/schemas/GcOutput'
          description: garbage collection over the window
        network:
          type: object
          properties:
            connections:
              type: integer
              format: int32
              nullable: true
              description: Open TCP sockets on the HTTP server, keep-alive included; null when unavailable
          required:
            - connections
          description: network information
        cpu:
          type: object
          properties:
            cpus:
              type: integer
              format: int16
              description: number of logical CPUs
            globalAverage:
              type: object
              properties:
                lastMinute:
                  allOf:
                    - $ref: '#/components/schemas/HealthOutputLoad'
                  description: cpu load average on last minute
                lastFiveMinutes:
                  allOf:
                    - $ref: '#/components/schemas/HealthOutputLoad'
                  description: cpu load average on five minute
                lastFifteenMinutes:
                  allOf:
                    - $ref: '#/components/schemas/HealthOutputLoad'
                  description: cpu load average on fifteen minute
              required:
                - lastMinute
                - lastFiveMinutes
                - lastFifteenMinutes
              description: cpu load average
            cores:
              type: array
              items:
                type: object
                properties:
                  core:
                    type: integer
                    format: int16
                    description: cpu core number
                  load:
                    type: string
                    description: cpu core load
                required:
                  - core
                  - load
              description: cpu cores
          required:
            - cpus
            - globalAverage
            - cores
          description: host CPU; machine-wide values, all processes included
        mongo:
          type: object
          properties:
            connection:
              type: object
              allOf:
                - $ref: '#/components/schemas/MongoConnectionOutput'
              nullable: true
              description: MongoDB serverStatus.connections (server-wide, all clients); null when unavailable
            memory:
              allOf:
                - $ref: '#/components/schemas/MongoCacheMemoryOutput'
              description: MongoDB WiredTiger cache metrics; values may be null when unsupported or unavailable
          required:
            - connection
            - memory
          description: mongo metrics
        postgres:
          type: object
          properties:
            connection:
              type: object
              allOf:
                - $ref: '#/components/schemas/PostgresConnectionOutput'
              nullable: true
              description: PostgreSQL connection metrics; null when unavailable
            databaseSizeBytes:
              type: string
              nullable: true
              description: Size of the application database (current_database()) in bytes; null when unavailable
          required:
            - connection
            - databaseSizeBytes
          description: postgres metrics
        redis:
          type: object
          allOf:
            - $ref: '#/components/schemas/RedisInfoOutput'
          nullable: true
          description: Redis INFO metrics; null when Redis is unreachable or INFO failed
      description: metrics output; does not decide readiness
    MongoCacheMemoryOutput:
      type: object
      required:
        - used
        - limit
      properties:
        used:
          type: string
          nullable: true
          description: Bytes currently in the cache
        limit:
          type: string
          nullable: true
          description: Maximum bytes configured for the cache
      description: MongoDB WiredTiger cache metrics; values may be null when unsupported or unavailable
    MongoConnectionOutput:
      type: object
      required:
        - active
        - available
        - current
        - totalCreated
      properties:
        active:
          type: integer
          format: int64
          description: Number of active connections currently in use
        available:
          type: integer
          format: int64
          description: Number of connection slots available for new clients
        current:
          type: integer
          format: int64
          description: Total number of current connections
        totalCreated:
          type: integer
          format: int64
          description: Total number of connections created since server start
        rejected:
          type: integer
          format: int64
          description: Connections rejected by the server; present on newer MongoDB versions
        queuedForEstablishment:
          type: integer
          format: int64
          description: Connections queued for establishment
        establishmentRateLimit:
          type: object
          properties:
            rejected:
              type: integer
              format: int64
            exempted:
              type: integer
              format: int64
            interruptedDueToClientDisconnect:
              type: integer
              format: int64
          required:
            - rejected
            - exempted
            - interruptedDueToClientDisconnect
          description: Connection establishment rate limit counters
        threaded:
          type: integer
          format: int64
          description: Number of threaded connections
        exhaustIsMaster:
          type: integer
          format: int64
          description: Number of exhaust isMaster connections
        exhaustHello:
          type: integer
          format: int64
          description: Number of exhaust hello connections
        awaitingTopologyChanges:
          type: integer
          format: int64
          description: Number of connections awaiting topology changes
      description: MongoDB serverStatus.connections; server-wide, all clients included
    PostgresConnectionOutput:
      type: object
      required:
        - active
        - available
        - current
      properties:
        active:
          type: integer
          format: int64
          description: Client backends active on the application database
        available:
          type: integer
          format: int64
          description: Connection slots left on the server, all databases considered
        current:
          type: integer
          format: int64
          description: Client backends connected to the application database
      description: PostgreSQL connection metrics
    ProcessOutput:
      type: object
      required:
        - hostname
        - pid
        - nodeVersion
        - environment
        - uptimeSeconds
        - cpu
      properties:
        hostname:
          type: string
          description: Machine or pod name; in Kubernetes it identifies which pod answered
        pid:
          type: integer
          format: int32
          description: Process id
        nodeVersion:
          type: string
          description: Node.js version
        environment:
          type: string
          description: Application environment
        uptimeSeconds:
          type: integer
          format: int32
          description: Process uptime in seconds
        cpu:
          type: object
          properties:
            usagePercent:
              type: number
              format: decimal
              description: CPU time over wall time in the window; 100% = one full core, like `top`
            userMs:
              type: number
              format: decimal
              description: User CPU time in the window, in milliseconds
            systemMs:
              type: number
              format: decimal
              description: System CPU time in the window, in milliseconds
          required:
            - usagePercent
            - userMs
            - systemMs
          description: CPU used by this process only (process.cpuUsage())
      description: process information
    ReadinessOutput:
      type: object
      required:
        - status
        - version
        - timestamp
        - checkedAt
        - dependencies
      properties:
        status:
          type: string
          description: '**UP** only when every dependency is UP; the endpoint answers 503 otherwise'
        version:
          type: string
          description: application version
        timestamp:
          type: string
          description: When this response was built
        checkedAt:
          type: string
          description: When the dependency checks ran; they are cached for 2s, so it can be older than `timestamp`
        dependencies:
          type: object
          properties:
            mongo:
              $ref: '#/components/schemas/DependencyCheck'
            postgres:
              $ref: '#/components/schemas/DependencyCheck'
            redis:
              $ref: '#/components/schemas/DependencyCheck'
          required:
            - mongo
            - postgres
            - redis
          description: dependency checks
      description: readiness probe output
    RedisInfoOutput:
      type: object
      required:
        - usedMemory
        - maxMemory
        - connectedClients
        - evictedKeys
      properties:
        usedMemory:
          type: string
          description: Memory used by Redis
        maxMemory:
          type: string
          nullable: true
          description: Configured maxmemory; null when 0 (no limit)
        connectedClients:
          type: integer
          format: int32
          description: Connected clients
        evictedKeys:
          type: integer
          format: int64
          description: Keys evicted because maxmemory was reached, since the Redis server started
      description: Redis INFO metrics
    RootHealthOutput:
      type: object
      required:
        - status
        - timestamp
        - uptime
      properties:
        status:
          type: string
          description: 'Application status: **UP** | **DOWN**'
        timestamp:
          type: string
          description: Timestamp of the health check
        uptime:
          type: number
          format: decimal
          description: Application uptime in seconds
      description: Root health response model
    StartupOutput:
      type: object
      required:
        - status
        - timestamp
        - checkedAt
        - phase
        - connections
        - message
      properties:
        status:
          type: string
          description: 'Application startup status: **UP** | **DOWN**'
        timestamp:
          type: string
          description: Timestamp of the health check
        checkedAt:
          type: string
          description: When the dependency checks ran; they are cached for 2s and shared with /health/ready
        phase:
          type: string
          description: Health check phase identifier
        connections:
          type: object
          properties:
            mongo:
              type: string
              description: 'MongoDB connection status: **connected** | **disconnected**'
            postgres:
              type: string
              description: 'PostgreSQL connection status: **connected** | **disconnected**'
            redis:
              type: string
              description: 'Redis connection status: **connected** | **disconnected**'
          required:
            - mongo
            - postgres
            - redis
          description: Connection status for each service
        message:
          type: string
          description: Human-readable status message
      description: Startup probe response model
