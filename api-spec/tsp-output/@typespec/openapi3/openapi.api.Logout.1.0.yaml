openapi: 3.0.0
info:
  title: Logout
  version: '1.0'
tags:
  - name: Logout
paths:
  /api/{version}/logout:
    get:
      operationId: LogoutController_logout
      description: |-
        Ends the session of the access token sent in the Authorization header.
        Its access and refresh tokens stop working immediately; other sessions of the user are kept.
      parameters:
        - $ref: '#/components/parameters/api.Utils.Versioning.VersionParams'
      responses:
        '204':
          description: session ended
        '401':
          description: When the token is missing, invalid or its session was already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutUnauthorizedError'
      tags:
        - Logout
      security:
        - BearerAuth: []
components:
  parameters:
    api.Utils.Versioning.VersionParams:
      name: version
      in: path
      required: true
      description: route version
      schema:
        $ref: '#/components/schemas/api.Utils.Versioning.ApiVersion'
  schemas:
    LogoutUnauthorizedError:
      type: object
      allOf:
        - type: object
          required:
            - error
          properties:
            error:
              type: object
              required:
                - code
                - traceid
                - context
                - message
                - timestamp
                - path
              properties:
                code:
                  type: number
                  enum:
                    - 401
                  description: status code
                traceid:
                  type: string
                  description: request traceid
                context:
                  type: string
                  description: class that error occur
                message:
                  type: array
                  items:
                    type: string
                    enum:
                      - invalidToken
                      - you have been logged out
                  description: error message
                timestamp:
                  type: string
                  description: timestamp that error occur
                path:
                  type: string
                  description: path error
              description: default error model
          description: When unauthorized occour.
      description: When the token is missing, invalid or its session was already ended
    api.Utils.Versioning.ApiVersion:
      type: string
      enum:
        - v1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
