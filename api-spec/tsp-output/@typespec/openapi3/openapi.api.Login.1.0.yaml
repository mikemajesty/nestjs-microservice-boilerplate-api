openapi: 3.0.0
info:
  title: Login
  version: '1.0'
tags:
  - name: Login
paths:
  /api/{version}/login:
    post:
      operationId: LoginController_login
      description: user login; opens a new session
      parameters:
        - $ref: '#/components/parameters/api.Utils.Versioning.VersionParams'
      responses:
        '201':
          description: login successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          description: When login input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginValidationError'
        '401':
          description: |-
            When the email is unknown or the password is wrong. Both cases answer the same error,
            so the endpoint does not reveal which emails have an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginInvalidCredentialsError'
      tags:
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/{version}/login/google:
    get:
      operationId: LoginController_loginGoogle
      description: Google OAuth login redirect
      parameters:
        - $ref: '#/components/parameters/api.Utils.Versioning.VersionParams'
      responses:
        '204':
          description: Redirects to Google OAuth
      tags:
        - Login
  /api/{version}/login/google/callback:
    get:
      operationId: LoginController_loginGoogleCallback
      description: Google OAuth callback
      parameters:
        - $ref: '#/components/parameters/api.Utils.Versioning.VersionParams'
      responses:
        '204':
          description: Handles Google OAuth callback
      tags:
        - Login
  /api/{version}/refresh:
    post:
      operationId: LoginController_refresh
      description: |-
        Exchanges a refresh token for a new access/refresh token pair (rotation).
        The refresh token sent stops working; always store the new one.
      parameters:
        - $ref: '#/components/parameters/api.Utils.Versioning.VersionParams'
      responses:
        '201':
          description: new token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenOutput'
        '400':
          description: When refresh input is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshValidationError'
        '401':
          description: |-
            When the refresh token is invalid, expired, already used, or its session was ended
            (logout, password change or reset). Reusing an already used refresh token also ends its session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshInvalidTokenError'
        '404':
          description: When user not found
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/LoginUserNotFoundError'
                  - $ref: '#/components/schemas/LoginRoleNotFoundError'
      tags:
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
components:
  parameters:
    api.Utils.Versioning.VersionParams:
      name: version
      in: path
      required: true
      description: route version
      schema:
        $ref: '#/components/schemas/api.Utils.Versioning.ApiVersion'
  schemas:
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          default: admin@admin.com
        password:
          type: string
          default: admin
      description: login input
    LoginInvalidCredentialsError:
      type: object
      allOf:
        - type: object
          required:
            - error
          properties:
            error:
              type: object
              required:
                - code
                - traceid
                - context
                - message
                - timestamp
                - path
              properties:
                code:
                  type: number
                  enum:
                    - 401
                  description: status code
                traceid:
                  type: string
                  description: request traceid
                context:
                  type: string
                  description: class that error occur
                message:
                  type: array
                  items:
                    type: string
                    enum:
                      - invalidCredentials
                  description: error message
                timestamp:
                  type: string
                  description: timestamp that error occur
                path:
                  type: string
                  description: path error
              description: default error model
          description: When unauthorized occour.
      description: |-
        When the email is unknown or the password is wrong. Both cases answer the same error,
        so the endpoint does not reveal which emails have an account.
    LoginOutput:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      description: login ouput
    LoginRoleNotFoundError:
